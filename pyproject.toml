[project]
name = "de-ai"
version = "1.0.0"
description = "DE-AI — Download Everything. Paste a link, mark the media you want, download it."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "yt-dlp>=2025.11.12",
]

[tool.vercel]
entrypoint = "vercel_app:app"
